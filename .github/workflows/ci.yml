name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install torch numpy pyyaml sentencepiece einops
      - run: python -c "from model.architecture import MaxConfig, MaxTransformer; print('import OK')"
      - run: python -c "
          from model.architecture import MaxConfig, MaxTransformer;
          import torch;
          c = MaxConfig(dim=128, n_layers=2, n_heads=4, n_kv_heads=2, n_routed_experts=4, n_activated_experts=2, n_expert_groups=2, n_limited_groups=1, q_lora_rank=64, kv_lora_rank=32, vocab_size=1000, max_seq_len=128, moe_intermediate_size=64, dense_intermediate_size=128);
          m = MaxTransformer(c);
          x = torch.randint(0, 1000, (1, 32));
          y, l = m(x, x);
          print('forward OK', y.shape)
          "
