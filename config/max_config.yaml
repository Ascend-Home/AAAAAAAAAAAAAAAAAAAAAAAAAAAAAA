model:
  vocab_size: 256000
  dim: 16384
  n_layers: 128
  n_heads: 128
  n_kv_heads: 16
  head_dim: 128
  n_routed_experts: 256
  n_shared_experts: 2
  n_activated_experts: 8
  moe_intermediate_size: 2048
  dense_intermediate_size: 53248
  first_k_dense_layers: 3
  n_expert_groups: 8
  n_limited_groups: 4
  q_lora_rank: 1536
  kv_lora_rank: 512
  qk_nope_head_dim: 128
  qk_rope_head_dim: 64
  v_head_dim: 128
  max_seq_len: 4096      # lowered from 1048576 — prevents OOM on startup
  original_seq_len: 4096
  rope_theta: 10000.0
  rope_factor: 40.0
  n_mtp_layers: 3

training:
  global_batch_size: 8192
  micro_batch_size: 1
  grad_accum: 128
  lr: 2.2e-4
  min_lr: 2.2e-5
  warmup_steps: 2000
  max_steps: 1000000
  weight_decay: 0.1
  grad_clip: 1.0
  seq_len: 4096
  save_interval: 500
  log_interval: 10
